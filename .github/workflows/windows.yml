name: Binaries

# Builds Prism.exe on a real Windows machine, because PyInstaller cannot
# cross-compile and this project is developed on a Mac. Runs on every tag, and
# on demand so the build can be checked without cutting a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install --upgrade pyinstaller

      - name: Build Prism.exe
        run: |
          pyinstaller --onefile --console --name Prism `
            --distpath dist `
            --paths engine `
            --add-data "engine/data;data" `
            --hidden-import gui `
            --hidden-import optimise3mf `
            --hidden-import mixer `
            --hidden-import meshimport `
            windows/prism_win.py

      - name: Smoke test the binary
        shell: pwsh
        run: |
          $n = (& ./dist/Prism.exe --engine --list | Measure-Object -Line).Lines
          if ($n -lt 20) { throw "expected the printer list, got $n lines" }
          Write-Host "printer list: $n entries"
          & ./dist/Prism.exe --engine --printer u1 --spectrum-list | Select-Object -First 3

      - name: Smoke test that the engine can read its data files
        shell: pwsh
        run: |
          $out = (& ./dist/Prism.exe --engine --list 2>&1 | Out-String)
          if ($out -match 'BROKEN BUILD') { throw "the engine cannot read its data files" }
          Write-Host "data files readable"

      - name: Smoke test the app window
        shell: pwsh
        env:
          PRISM_NO_BROWSER: '1'
        run: |
          # The path a double-click takes, never covered before this.
          $p = Start-Process ./dist/Prism.exe -PassThru -NoNewWindow -RedirectStandardOutput gui.log
          $url = $null
          foreach ($i in 1..40) {
            if (Test-Path gui.log) {
              $m = Select-String -Path gui.log -Pattern 'Prism running at (\S+)' | Select-Object -First 1
              if ($m) { $url = $m.Matches[0].Groups[1].Value; break }
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $url) { if (Test-Path gui.log) { Get-Content gui.log }; throw "the app window never started" }
          $body = (Invoke-WebRequest $url -UseBasicParsing).Content
          if ($body -notmatch '<title>Prism') { throw "page did not render" }
          Write-Host "app window served $($body.Length) bytes"
          $tok = ($url -split 't=')[1]; $base = ($url -split '/\?')[0]
          Invoke-WebRequest "$base/api/bye?t=$tok" -UseBasicParsing | Out-Null
          foreach ($i in 1..40) { if ($p.HasExited) { break }; Start-Sleep -Seconds 1 }
          if (-not $p.HasExited) { $p.Kill(); throw "did not exit on goodbye" }
          Write-Host "exited on goodbye"

      - name: Smoke test the script launcher
        shell: pwsh
        env:
          PRISM_NO_BROWSER: '1'
        run: |
          # The script zip's path: Prism.bat launching through pythonw, which
          # has no console. A failure there used to produce no window and no
          # message, which is unreportable by the person it happens to.
          # <nul is required: the failure path ends in `pause`.
          New-Item -ItemType Directory -Path scripttest -Force | Out-Null
          New-Item -ItemType File -Path empty.in -Force | Out-Null
          Copy-Item windows/Prism.bat scripttest/
          Copy-Item -Recurse engine scripttest/engine
          # Wait on the launcher PROCESS, never on its output stream. Draining
          # the stream waits for EOF, and the detached pythonw inherits those
          # handles, so `& cmd /c ... 2>&1` blocks for the life of the app and
          # reports the launcher as hung when it exited seconds ago.
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process cmd -ArgumentList '/c','Prism.bat' -PassThru -NoNewWindow `
                 -WorkingDirectory scripttest -RedirectStandardOutput bat.log `
                 -RedirectStandardError bat.err -RedirectStandardInput (Resolve-Path empty.in)
          if (-not $p.WaitForExit(60000)) {
            $p.Kill(); throw "launcher blocked $([int]$sw.Elapsed.TotalSeconds)s instead of returning"
          }
          $sw.Stop()
          $out = (Get-Content bat.log, bat.err -ErrorAction SilentlyContinue) -join "`n"
          if ($out -match 'could not start') { $out; throw "the launcher could not start the app" }
          # It must RETURN, not stay attached for the life of the app. An
          # earlier version blocked for the full 900s idle timeout, which would
          # have left a console window open on the user's desktop all session.
          Write-Host "launcher returned in $([int]$sw.Elapsed.TotalSeconds)s and started the app"
          Get-Process pythonw -ErrorAction SilentlyContinue | Stop-Process -Force

          # Control: break the app and require the launcher to SAY so. Without
          # this the check above would pass just as happily on a launcher that
          # swallows everything, which is the bug being fixed.
          Set-Content scripttest/engine/gui.py 'raise SystemExit("deliberate failure for the control test")'
          $q = Start-Process cmd -ArgumentList '/c','Prism.bat' -PassThru -NoNewWindow `
                 -WorkingDirectory scripttest -RedirectStandardOutput bad.log `
                 -RedirectStandardError bad.err -RedirectStandardInput (Resolve-Path empty.in)
          if (-not $q.WaitForExit(60000)) { $q.Kill(); throw "broken launcher hung" }
          $bad = (Get-Content bad.log, bad.err -ErrorAction SilentlyContinue) -join "`n"
          if ($bad -notmatch 'could not start') { $bad; throw "a broken app launched silently: this check proves nothing" }
          Write-Host "control: a broken app is reported, not swallowed"

      - name: Smoke test the file picker command
        shell: pwsh
        run: |
          # The picker needs a human to click it, so CI cannot open the dialog.
          # It can check the two things that break it silently: whether the
          # script PowerShell is given parses, and whether OpenFileDialog
          # accepts the filter, which it validates on assignment and rejects by
          # throwing. A rejected filter kills the script before ShowDialog and
          # the button then does nothing, with no error a user can see.
          #
          # Read the script from the module rather than grepping for a shape.
          # The previous version of this check looked for "ps = (" and silently
          # stopped matching when that code changed, which failed the build and
          # cost a release its Windows binary.
          python -c "import sys; sys.path.insert(0,'engine'); import gui; sys.stdout.write(gui.WIN_PICKER_PS)" > picker.ps1
          if (-not (Test-Path picker.ps1) -or (Get-Item picker.ps1).Length -lt 50) {
            throw "could not read WIN_PICKER_PS from engine/gui.py"
          }
          Get-Content picker.ps1 | ForEach-Object { Write-Host "  $_" }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path picker.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Host $_.Message }; throw "picker script does not parse" }
          Write-Host "parses cleanly"
          Add-Type -AssemblyName System.Windows.Forms
          $d = New-Object System.Windows.Forms.OpenFileDialog
          $f = (Get-Content picker.ps1 -Raw)
          if ($f -match 'Filter = "([^"]*)"') {
            try { $d.Filter = $matches[1]; Write-Host "filter accepted: $($matches[1])" }
            catch { throw "OpenFileDialog REJECTED the filter: $($_.Exception.Message)" }
          } else { throw "no filter found in the picker script" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "pkg/Prism (Windows)" | Out-Null
          Copy-Item dist/Prism.exe "pkg/Prism (Windows)/Prism.exe"
          Copy-Item README.md "pkg/Prism (Windows)/README.txt"
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "dev" }
          Compress-Archive -Path "pkg/Prism (Windows)" -DestinationPath "Prism-$tag-Windows.zip"
          Get-ChildItem *.zip | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }

      - uses: actions/upload-artifact@v4
        with:
          name: Prism-Windows
          path: Prism-*-Windows.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Prism $tag" --generate-notes }
          gh release upload $tag (Get-Item Prism-*-Windows.zip).Name --clobber
        shell: pwsh

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install --upgrade pyinstaller

      - name: Build the Prism binary
        run: |
          pyinstaller --onefile --console --name prism \
            --distpath dist \
            --paths engine \
            --add-data "engine/data:data" \
            --hidden-import gui \
            --hidden-import optimise3mf \
            --hidden-import mixer \
            --hidden-import meshimport \
            linux/prism_linux.py

      - name: Smoke test the binary
        run: |
          n=$(./dist/prism --engine --list | wc -l)
          [ "$n" -ge 20 ] || { echo "expected the printer list, got $n lines"; exit 1; }
          echo "printer list: $n entries"
          ./dist/prism --engine --printer u1 --spectrum-list | head -3

      - name: Smoke test that the engine can read its data files
        run: |
          out=$(./dist/prism --engine --list 2>&1)
          case "$out" in
            *"BROKEN BUILD"*) echo "the engine cannot read its data files"; exit 1 ;;
          esac
          echo "data files readable"

      - name: Smoke test the app window
        env:
          PRISM_NO_BROWSER: '1'
        run: |
          # The path a double-click takes. Nothing tested it until now, which is
          # why a break here would have reached users before CI.
          ./dist/prism > gui.log 2>&1 &
          pid=$!
          for i in $(seq 1 40); do grep -q 'Prism running at' gui.log && break; sleep 0.5; done
          url=$(sed -n 's/.*Prism running at //p' gui.log | head -1)
          [ -n "$url" ] || { echo "the app window never started"; cat gui.log; exit 1; }
          body=$(curl -fsS --max-time 10 "$url")
          case "$body" in *"<title>Prism"*) ;; *) echo "page did not render"; exit 1;; esac
          echo "app window served $(printf '%s' "$body" | wc -c) bytes"
          # And that closing the tab still quits it, which is the other half of
          # the session fix: too eager and it dies while you look elsewhere.
          tok=${url#*t=}; base=${url%%/\?*}
          curl -fsS --max-time 5 "$base/api/bye?t=$tok" > /dev/null
          for i in $(seq 1 40); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill $pid; echo "did not exit on goodbye"; exit 1; fi
          echo "exited on goodbye"

      - name: Package
        run: |
          tag="${{ github.ref_name }}"
          case "$tag" in v*) ;; *) tag=dev ;; esac
          mkdir -p "pkg/prism"
          cp dist/prism "pkg/prism/prism"
          cp README.md "pkg/prism/README.md"
          cp docs/COLOUR.md "pkg/prism/COLOUR.md" 2>/dev/null || true
          chmod +x "pkg/prism/prism"
          tar -czf "Prism-$tag-Linux.tar.gz" -C pkg prism
          ls -lh Prism-*-Linux.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: Prism-Linux
          path: Prism-*-Linux.tar.gz

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Prism $tag" --generate-notes
          gh release upload "$tag" Prism-*-Linux.tar.gz --clobber
